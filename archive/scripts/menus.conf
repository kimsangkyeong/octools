# OCP 관리도구 (octools) - 메뉴 설정 파일
#
# 형식: ID|메뉴명|스크립트파일|NS필요(Y/N)|카테고리|설명|POD필요(Y/N)
#
# - '#'으로 시작하는 줄은 주석
# - 빈 줄은 무시
# - 구분자: '|' (파이프)
# - NS필요: Y=namespace 선택 서브메뉴 표시, N=바로 실행
# - POD필요: Y=namespace 선택 후 pod 선택 서브메뉴 추가 표시 (7번째 필드, 생략시 N)
# - 스크립트파일: scripts/menus/ 디렉토리 내 파일명
#
# 새 메뉴 추가 시:
#   1. 이 파일에 항목 추가
#   2. scripts/menus/ 에 해당 .sh 파일 생성
#   3. CLI/API 자동 반영 (재시작 불필요)
#

# ─── 워크로드 ──────────────────────────────────────────────────
pod_list|Pod 조회|pod_list.sh|Y|워크로드|전체/특정 NS의 Pod 목록 조회|N
pod_wide|Pod 상태 상세|pod_wide.sh|Y|워크로드|Pod IP, Node 정보 포함 상세 조회|N
pod_logs|Pod 로그 조회|pod_logs.sh|Y|워크로드|특정 Pod의 로그 출력 (tail 100)|Y
container_images|컨테이너 이미지 목록|container_images.sh|Y|워크로드|Pod에서 사용 중인 컨테이너 이미지 목록 조회|N
deployment_list|Deployment 조회|deployment_list.sh|Y|워크로드|Deployment 목록 조회|N

# ─── 클러스터 ──────────────────────────────────────────────────
node_list|Node 상태 조회|node_list.sh|N|클러스터|클러스터 노드 상태 조회|N
co_list|ClusterOperator 조회|co_list.sh|N|클러스터|ClusterOperator 상태 조회|N
mc_list|MachineConfig 조회|mc_list.sh|N|클러스터|MachineConfig 목록 조회|N
mcp_list|MachineConfigPool 조회|mcp_list.sh|N|클러스터|MachineConfigPool 상태 조회|N

# ─── 오퍼레이터 ────────────────────────────────────────────────
catalogsource_list|CatalogSource 조회|catalogsource_list.sh|Y|오퍼레이터|CatalogSource 목록 및 상태 조회|N
subscription_list|Subscription 조회|subscription_list.sh|Y|오퍼레이터|Operator Subscription 목록 조회|N

# ─── 네트워크 ──────────────────────────────────────────────────
svc_list|Service 조회|svc_list.sh|Y|네트워크|Service 목록 조회|N
route_list|Route 조회|route_list.sh|Y|네트워크|Route 목록 조회|N

# ─── 스토리지 ──────────────────────────────────────────────────
pvc_list|PVC 조회|pvc_list.sh|Y|스토리지|PersistentVolumeClaim 목록 조회|N

# ─── 종합조회 ──────────────────────────────────────────────────
ns_resources|Namespace 리소스 종합조회|ns_resources.sh|Y|종합조회|NS내 Pod,Deploy,Svc,DS,CM,STS,Secret 종합 조회 (SA 포함)|N

# ─── 기타 ──────────────────────────────────────────────────────
event_list|Event 조회|event_list.sh|Y|기타|이벤트 목록 조회 (시간순)|N
csr_list|CSR 조회|csr_list.sh|N|기타|CertificateSigningRequest 목록 조회|N
